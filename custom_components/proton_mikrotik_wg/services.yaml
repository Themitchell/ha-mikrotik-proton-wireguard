provision_wireguard:
  name: Provision WireGuard credential(s)
  description: >
    Create Proton WireGuard certificates for all configured tunnels
    (or one optional slot). Uses distinct Proton servers when provisioning all.
  fields:
    slot:
      name: Slot
      description: Optional 1-based tunnel slot to reprovision. Omit to provision all.
      example: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    entry_id:
      name: Config entry ID
      description: Optional. Defaults to the only configured entry.
      selector:
        text:

apply_wireguard:
  name: Apply WireGuard to MikroTik
  description: >
    Push stored Proton credentials onto wg-proton-1..N as tunnel-only configs
    (no LAN egress via VPN yet).
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Defaults to the only configured entry.
      selector:
        text:
