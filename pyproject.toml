[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-mikrotik-wg"
version = "0.1.0"
description = "Home Assistant integration: Proton WireGuard on a single MikroTik interface"
requires-python = ">=3.12"
dependencies = ["voluptuous", "proton-client>=0.5.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
pythonpath = ["custom_components"]
testpaths = ["tests"]
addopts = [
  "--cov=proton_mikrotik_wg",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["custom_components/proton_mikrotik_wg"]
omit = [
  # Home Assistant wiring — covered once pytest-homeassistant harness exists
  "*/config_flow.py",
  "*/__init__.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
