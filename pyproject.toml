[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-mikrotik-wg"
version = "0.6.0"
description = "Home Assistant integration: Proton WireGuard on a single MikroTik interface"
requires-python = ">=3.12"
dependencies = ["voluptuous", "proton-client>=0.5.1", "cryptography>=41", "librouteros>=3.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["custom_components"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--cov=proton_mikrotik_wg",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["custom_components/proton_mikrotik_wg"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.\\s*$",
]
